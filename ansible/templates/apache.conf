<VirtualHost *:80>

	#ServerName www.example.com

	ServerAdmin webmaster@localhost
	DocumentRoot {{staticPortalDir}}

	SetEnv PERL5LIB "{{codeDir}}/code:{{codeDir}}/webapps:{{codeDir}}/htdocs/CrispyCrunch"
	SetEnv BLASTDB  "{{dataDirBlast}}"
	SetEnv HTML_WEB_DIR "{{codeDir}}/htdocs/CrispyCrunch/"
	SetEnv WEB_APP_DIR "{{codeDir}}/webapps/CrispyCrunch/"


	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	#Include conf-available/serve-cgi-bin.conf


	ScriptAlias /cgi-bin/CrispyCrunch/ {{codeDir}}/cgi-bin/CrispyCrunch/
	<Directory {{codeDir}}/cgi-bin/CrispyCrunch/>
       AllowOverride None
       Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
       Require all granted
	</Directory>


	ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
	<Directory "/usr/lib/cgi-bin">
       AllowOverride None
       Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
       Require all granted
	</Directory>

    Alias /CrispyCrunch {{codeDir}}/htdocs/CrispyCrunch
        <Directory {{codeDir}}/htdocs/CrispyCrunch>
        Order allow,deny
        Allow from all
        Require all granted
    </Directory>

	<Directory {{staticPortalDir}}>
		Order allow,deny
		Options Indexes FollowSymLinks
		Allow from all
		Require all granted
	</Directory>

</VirtualHost>
