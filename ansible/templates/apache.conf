<VirtualHost *:80>

	#ServerName www.example.com

	ServerAdmin webmaster@localhost
	DocumentRoot {{staticPortalDir}}

	# SetEnv xyz "123"


	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	#Include conf-available/serve-cgi-bin.conf


	ScriptAlias /cgi-bin/CrisypyCrunch/ {{codeDir}}/cgi-bin/CrispyCrunch/
	<Directory {{codeDir}}/cgi-bin/CrispyCrunch/>
		AllowOverride None
		Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
		Allow from all
	</Directory>


	ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
	<Directory "/usr/lib/cgi-bin">
		AllowOverride None
		Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
		Order allow,deny
		Allow from all
	</Directory>

	<Directory {{staticPortalDir}}>
		Order allow,deny
		Options Indexes FollowSymLinks
		Allow from all
		Require all granted
	</Directory>

</VirtualHost>
